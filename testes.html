<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="img/icone.svg?v=0.8.1">
  <title>Consulta de Escala - Testes automáticos</title>
  <style>
    body { font-family: "Segoe UI", system-ui, Arial, sans-serif; background: #f3f5f9; color: #17212f; margin: 0; padding: 24px; }
    main { max-width: 820px; margin: 0 auto; }
    h1 { margin: 0 0 6px; }
    h2 { font-size: 15px; margin: 22px 0 8px; color: #667388; text-transform: uppercase; letter-spacing: .5px; }
    #resumo { font-weight: 700; padding: 12px 16px; border-radius: 12px; }
    .ok-geral { background: #ddf3e8; color: #1e8e5a; }
    .falha-geral { background: #fde3e0; color: #c0392b; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { background: #fff; border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; border-left: 5px solid #1e8e5a; }
    li.falha { border-color: #c0392b; }
    li small { display: block; color: #c0392b; margin-top: 4px; }
  </style>
</head>
<body>
<main>
  <h1>Testes automáticos da escala</h1>
  <p>Confere as regras de <code>js/core/</code> com os dados da pasta <code>dados/</code>. Abra de novo depois de editar os dados.</p>
  <p id="resumo"></p>
  <div id="lista"></div>
</main>

<script src="dados/geral.js?v=0.8.1"></script>
<script src="dados/unidades/maua.js?v=0.8.1"></script>
<script src="dados/unidades/vitoria.js?v=0.8.1"></script>
<script src="dados/unidades/paranagua.js?v=0.8.1"></script>
<script src="dados/unidades/curitiba.js?v=0.8.1"></script>
<script src="js/core/datas.js?v=0.8.1"></script>
<script src="js/core/documentos.js?v=0.8.1"></script>
<script src="js/core/regras/base.js?v=0.8.1"></script>
<script src="js/core/regras/fixa.js?v=0.8.1"></script>
<script src="js/core/regras/rotativa.js?v=0.8.1"></script>
<script src="js/core/regras/mensal.js?v=0.8.1"></script>
<script src="js/core/escala.js?v=0.8.1"></script>
<script src="js/core/repositorio.js?v=0.8.1"></script>
<script src="js/core/sessao.js?v=0.8.1"></script>
<script>
(function () {
  "use strict";
  const E = window.Escala;
  // Chave própria: os testes nunca mexem nos dados que o usuário cadastrou.
  E.repositorio.carregar({ chave: "escala5x2.testes", limpar: true });
  const { datas: D, escala: R, sessao: S, regras, repositorio: Repo, documentos: Doc } = E;
  const dados = () => E.dados;
  const grupos = [];
  let grupo = null;

  const secao = (nome) => { grupo = { nome, itens: [] }; grupos.push(grupo); };
  function teste(nome, fn) {
    try {
      const r = fn();
      grupo.itens.push({ nome, ok: r === true, msg: r === true ? "" : String(r) });
    } catch (e) {
      grupo.itens.push({ nome, ok: false, msg: e.message });
    }
  }

  /* ---------- Apoio ---------- */
  const ANO = 2026;
  const doTipo = (tipo) => R.unidades().filter((u) => u.tipoEscala === tipo);
  const segundasDoAno = () => {
    const s0 = D.segundaDaSemana(new Date(ANO, 0, 5));
    return Array.from({ length: 52 }, (_, i) => D.addDias(s0, i * 7));
  };
  const diasDoAno = () => Array.from({ length: 365 }, (_, i) => D.addDias(new Date(ANO, 0, 1), i));
  const folgasNaSemana = (p, seg) =>
    Array.from({ length: 7 }, (_, i) => D.addDias(seg, i)).filter((d) => R.situacaoNaEscala(p, d) === "folga").map((d) => d.getDay());
  const mesesPublicados = (u) => Object.keys(u.meses).sort().map((k) => D.deIso(`${k}-01`));
  const diasDoMes = (m) => Array.from({ length: D.diasNoMes(m) }, (_, i) => new Date(m.getFullYear(), m.getMonth(), i + 1));

  function coberturaSemAusencias(u, dias) {
    for (const d of dias) {
      for (const [funcao, minimo] of Object.entries(u.coberturaMinima)) {
        const n = u.equipe.filter((p) => p.funcao === funcao && R.situacaoNaEscala(p, d) === "trabalho").length;
        if (n < minimo) return `${u.nome}, ${D.iso(d)}: ${n} ${funcao}s (mínimo ${minimo})`;
      }
    }
    return true;
  }

  /* ---------- Dados ---------- */
  secao("Dados");
  teste("Os arquivos de dados são válidos", () => {
    const erros = R.validarDados();
    return erros.length === 0 || erros.join(" | ");
  });
  teste("Existe pelo menos uma unidade de cada tipo de escala", () =>
    ["rotativa", "fixa", "mensal"].every((t) => doTipo(t).length) || "falta algum tipo");

  /* ---------- Rotativa ---------- */
  secao("Escala rotativa (Mauá)");
  teste(`Todos folgam exatamente 2 dias seguidos em todas as semanas de ${ANO}`, () => {
    for (const u of doTipo("rotativa")) for (const p of u.equipe) for (const seg of segundasDoAno()) {
      const f = folgasNaSemana(p, seg);
      if (f.length !== 2) return `${p.nome}, semana de ${D.iso(seg)}: ${f.length} folgas`;
    }
    return true;
  });
  teste("As folgas avançam 1 dia a cada semana", () => {
    const inicioDoPar = (dias) => {
      const idx = dias.map((d) => (d + 6) % 7);
      return idx.find((k) => idx.includes((k + 1) % 7));
    };
    for (const u of doTipo("rotativa")) for (const p of u.equipe) {
      const semanas = segundasDoAno();
      for (let i = 1; i < semanas.length; i++) {
        const antes = inicioDoPar(regras.rotativa.folgasDaSemana(p, semanas[i - 1], u));
        const depois = inicioDoPar(regras.rotativa.folgasDaSemana(p, semanas[i], u));
        if (depois !== (antes + 1) % 7) return `${p.nome}: não avançou na semana de ${D.iso(semanas[i])}`;
      }
    }
    return true;
  });
  teste("Todos folgam pelo menos 1 domingo a cada 7 semanas", () => {
    for (const u of doTipo("rotativa")) for (const p of u.equipe) {
      const doms = segundasDoAno().map((s) => D.addDias(s, 6));
      for (let i = 0; i + 7 <= doms.length; i++) {
        if (!doms.slice(i, i + 7).some((d) => R.situacaoNaEscala(p, d) === "folga")) return `${p.nome}: sem domingo a partir de ${D.iso(doms[i])}`;
      }
    }
    return true;
  });
  teste(`Sem ausências, a cobertura mínima é atendida em ${ANO}`, () => {
    for (const u of doTipo("rotativa")) { const r = coberturaSemAusencias(u, diasDoAno()); if (r !== true) return r; }
    return true;
  });

  /* ---------- Fixa ---------- */
  secao("Escala fixa (Vitória)");
  teste(`Todos folgam nos mesmos 2 dias em todas as semanas de ${ANO}`, () => {
    for (const u of doTipo("fixa")) for (const p of u.equipe) {
      const esperado = [...p.folgas].sort().join();
      for (const seg of segundasDoAno()) {
        const f = folgasNaSemana(p, seg).sort().join();
        if (f !== esperado) return `${p.nome}, semana de ${D.iso(seg)}: ${f} (esperado ${esperado})`;
      }
    }
    return true;
  });
  teste(`Sem ausências, a cobertura mínima é atendida em ${ANO}`, () => {
    for (const u of doTipo("fixa")) { const r = coberturaSemAusencias(u, diasDoAno()); if (r !== true) return r; }
    return true;
  });
  teste("Alerta de domingo lista exatamente quem nunca folga no domingo", () => {
    for (const u of doTipo("fixa")) {
      const esperado = u.equipe.filter((p) => !p.folgas.includes(0)).map((p) => p.matricula).join();
      const obtido = R.semDomingoDeFolga(u, D.hoje()).map((p) => p.matricula).join();
      if (esperado !== obtido) return `${u.nome}: esperado [${esperado}], obtido [${obtido}]`;
    }
    return true;
  });

  /* ---------- Mensal ---------- */
  secao("Escala mensal (Paranaguá e Curitiba)");
  teste("Em cada mês publicado, toda semana inteira do mês tem 2 folgas", () => {
    for (const u of doTipo("mensal")) for (const m of mesesPublicados(u)) {
      const fim = D.addDias(D.addMeses(m, 1), -1);
      for (let seg = D.segundaDaSemana(m); seg <= fim; seg = D.addDias(seg, 7)) {
        if (seg < m || D.addDias(seg, 6) > fim) continue; // semana atravessa o mês
        for (const p of u.equipe) {
          const f = folgasNaSemana(p, seg);
          if (f.length !== 2) return `${u.nome}, ${p.nome}, semana de ${D.iso(seg)}: ${f.length} folgas`;
        }
      }
    }
    return true;
  });
  teste("A escala muda de um mês publicado para o seguinte", () => {
    for (const u of doTipo("mensal")) {
      const chaves = Object.keys(u.meses).sort();
      for (let i = 1; i < chaves.length; i++) {
        const mudou = u.equipe.some((p) => u.meses[chaves[i]].folgas[p.matricula].join() !== u.meses[chaves[i - 1]].folgas[p.matricula].join());
        if (!mudou) return `${u.nome}: ${chaves[i]} igual a ${chaves[i - 1]}`;
      }
    }
    return true;
  });
  teste("Mês não publicado aparece como 'a publicar'", () => {
    const u = doTipo("mensal").find((x) => !x.meses["2026-11"]);
    if (!u) return true;
    return R.situacao(u.equipe[0], new Date(2026, 10, 10)) === "pendente" && R.statusDia(u, new Date(2026, 10, 10)) === "pendente"
      || "não ficou pendente";
  });
  teste("Sem ausências, a cobertura mínima é atendida nos meses publicados", () => {
    for (const u of doTipo("mensal")) {
      const r = coberturaSemAusencias(u, mesesPublicados(u).flatMap(diasDoMes));
      if (r !== true) return r;
    }
    return true;
  });

  /* ---------- Comum ---------- */
  secao("Regras comuns");
  teste("Férias e atestado têm prioridade sobre a escala", () => {
    for (const u of R.unidades()) for (const a of u.ausencias) {
      const p = R.porMatricula(a.matricula);
      for (const dia of [a.inicio, a.fim]) {
        if (R.situacao(p, D.deIso(dia)) !== a.tipo) return `${p.nome} em ${dia} não aparece como ${a.tipo}`;
      }
    }
    return true;
  });
  teste("O alerta de cobertura dispara em férias que deixam a unidade abaixo do mínimo", () => {
    const u = R.unidade("maua");
    const ferias = u.ausencias.find((a) => a.tipo === "ferias");
    for (let d = D.deIso(ferias.inicio); d <= D.deIso(ferias.fim); d = D.addDias(d, 1)) {
      if (R.statusDia(u, d) === "baixa") return true;
    }
    return "nenhum dia abaixo do mínimo durante as férias";
  });
  teste("A semana começa na segunda-feira", () =>
    D.iso(D.segundaDaSemana(D.deIso("2026-10-04"))) === "2026-09-28" || "início da semana errado");
  teste("Contagem de dias atravessa mês e ano", () =>
    D.diasEntre(D.deIso("2026-12-30"), D.deIso("2027-01-02")) === 3 || "contagem errada");
  teste("Nomes dos dias saem na ordem de segunda a domingo", () =>
    D.nomesDias([0, 6]) === "Sábado e Domingo" || D.nomesDias([0, 6]));

  /* ---------- Login ---------- */
  secao("Login simulado");
  const senha = () => dados().senhaDemo;
  teste("Recusa senha errada e matrícula inexistente", () =>
    (!!S.entrar("10001", "senha-errada").erro && !!S.entrar("99999", senha()).erro) || "aceitou acesso inválido");
  teste("Duas visões: colaborador e liderança, cada uma com os CDDs certos", () => {
    const vis = (m) => S.entrar(m, senha()).usuario;
    const c = vis("10001"), sup = vis("92001"), coord = vis("80002"), ger = vis("90000");
    S.sair();
    const ok = c.perfil === "colaborador" && c.unidadeIds.join() === "maua" &&
               [sup, coord, ger].every((l) => l.perfil === "lideranca") &&
               sup.unidadeIds.join() === "vitoria" &&
               coord.unidadeIds.join() === "paranagua,curitiba" &&
               ger.unidadeIds.length === R.unidades().length;
    return ok || JSON.stringify({ c, sup, coord, ger });
  });
  teste("Cargo é só rótulo e a liderança local de cada CDD é encontrada", () => {
    const ger = S.entrar("90000", senha()).usuario;
    S.sair();
    return (ger.funcao === "Gerente regional" &&
            R.unidades().every((u) => R.liderancaLocal(u).length === 1)) || "liderança local ausente";
  });
  teste("Líder sem CDD ou com CDD inexistente é recusado na validação", () => {
    const original = JSON.stringify(dados().liderancas);
    dados().liderancas.push({ matricula: "70001", nome: "Sem Unidade", cargo: "Supervisor", unidades: [] });
    dados().liderancas.push({ matricula: "70002", nome: "Unidade Errada", cargo: "Supervisor", unidades: ["xyz"] });
    const erros = R.validarDados();
    dados().liderancas = JSON.parse(original);
    return (erros.length === 2) || erros.join(" | ");
  });

  /* ---------- Documentos ---------- */
  secao("PIS e CPF");
  teste("Aceita PIS e CPF válidos e recusa dígito errado", () =>
    (Doc.pisValido("14087560224") && !Doc.pisValido("14087560225") &&
     Doc.cpfValido("52998224725") && !Doc.cpfValido("52998224726") &&
     !Doc.pisOuCpfValido("11111111111")) || "validação de documento errada");

  /* ---------- Cadastro (repositório) ---------- */
  secao("Cadastro");
  const novo = (extra = {}) => ({ nome: "Teste Silva", matricula: "29999", pis: "52998224725", funcao: "Motorista", rota: "Rota 299", folgas: [6, 0], ...extra });

  teste("Cadastra colaborador novo na escala fixa", () => {
    const r = Repo.salvarPessoa("vitoria", novo());
    if (r.erros) return r.erros.join(" | ");
    const p = R.porMatricula("29999");
    return (p && R.situacao(p, D.deIso("2026-10-03")) === "folga" && R.situacao(p, D.deIso("2026-10-05")) === "trabalho") || "não entrou na escala";
  });
  teste("Recusa cadastro inválido e não altera nada", () => {
    const antes = JSON.stringify(E.dados);
    const casos = [
      Repo.salvarPessoa("vitoria", novo({ matricula: "29998", pis: "11293438965" })), // PIS repetido
      Repo.salvarPessoa("vitoria", novo({ matricula: "29998", pis: "12345678901" })), // PIS inválido
      Repo.salvarPessoa("vitoria", novo({ matricula: "29998", folgas: [3, 3] })),     // folgas iguais
      Repo.salvarPessoa("vitoria", novo({ pis: "39053344705" })),                     // matrícula repetida
    ];
    const aceitou = casos.findIndex((r) => !r.erros);
    if (aceitou >= 0) return `caso ${aceitou + 1} foi aceito`;
    return JSON.stringify(E.dados) === antes || "os dados mudaram mesmo com erro";
  });
  teste("Falta só é aceita em dia de trabalho da escala", () => {
    // Folgas de sábado e domingo: 27/09 é domingo, 28/09 é segunda.
    const folga = Repo.salvarOcorrencia("vitoria", { matricula: "29999", tipo: "falta", inicio: "2026-09-27", fim: "2026-09-27" });
    const trabalho = Repo.salvarOcorrencia("vitoria", { matricula: "29999", tipo: "falta", inicio: "2026-09-28", fim: "2026-09-28" });
    return (!!folga.erros && trabalho.ok && R.situacao(R.porMatricula("29999"), D.deIso("2026-09-28")) === "falta") || "regra da falta errada";
  });
  teste("Desligamento tira a pessoa do quadro, da cobertura e do login", () => {
    const r = Repo.desligarPessoa("29999", "2026-09-30"); // data no passado
    if (r.erros) return r.erros.join(" | ");
    const p = R.porMatricula("29999");
    const u = R.unidade("vitoria");
    const fora = R.situacao(p, D.deIso("2026-10-01")) === "inativo" && !R.equipeAtiva(u, D.deIso("2026-10-01")).includes(p);
    const dentro = R.situacao(p, D.deIso("2026-09-28")) === "falta"; // histórico preservado
    return (fora && dentro && !!S.entrar("29999", senha()).erro) || "desligamento não aplicado";
  });
  teste("Contratado na mensal não precisa de folgas antes da admissão", () => {
    const base = { nome: "Novo Mensal", matricula: "49999", pis: "39053344705", funcao: "Ajudante", rota: "Rota 499", admissao: "2026-10-01" };
    const semOutubro = Repo.salvarPessoa("curitiba", { ...base, folgasMensais: { "2026-11": [2, 3] } });
    const completo = Repo.salvarPessoa("curitiba", { ...base, folgasMensais: { "2026-10": [2, 3], "2026-11": [2, 3] } });
    return (!!semOutubro.erros && completo.ok) || JSON.stringify({ semOutubro, completo });
  });
  teste("Troca de jornada do CDD mantém os dados válidos", () => {
    const r = Repo.salvarUnidade("vitoria", { tipoEscala: "rotativa", inicioCiclo: "2026-01-05", coberturaMinima: { Motorista: 2, Ajudante: 2 } });
    const volta = Repo.salvarUnidade("vitoria", { tipoEscala: "fixa", coberturaMinima: { Motorista: 2, Ajudante: 2 } });
    return (r.ok && volta.ok && R.porMatricula("20001").folgas.join() === "6,0") || JSON.stringify({ r, volta });
  });
  teste("Exportar e importar devolvem os mesmos dados; arquivo inválido é recusado", () => {
    const texto = Repo.exportar();
    const lixo = Repo.importar("isto não é json");
    const ok = Repo.importar(texto);
    return (!!lixo.erros && ok.ok && Repo.exportar().includes('"49999"')) || "exportação/importação falhou";
  });
  teste("Restaurar exemplo apaga as alterações", () => {
    Repo.restaurarExemplo();
    return (!R.porMatricula("29999") && !R.porMatricula("49999") && !Repo.personalizado()) || "exemplo não restaurado";
  });

  /* ---------- Resultado ---------- */
  const todos = grupos.flatMap((g) => g.itens);
  const falhas = todos.filter((r) => !r.ok).length;
  const resumo = document.getElementById("resumo");
  resumo.textContent = falhas ? `${falhas} de ${todos.length} testes falharam.` : `Todos os ${todos.length} testes passaram.`;
  resumo.className = falhas ? "falha-geral" : "ok-geral";

  const lista = document.getElementById("lista");
  grupos.forEach((g) => {
    const h = document.createElement("h2");
    h.textContent = g.nome;
    const ul = document.createElement("ul");
    g.itens.forEach((r) => {
      const li = document.createElement("li");
      li.className = r.ok ? "" : "falha";
      li.textContent = (r.ok ? "OK  " : "FALHOU  ") + r.nome;
      if (!r.ok) {
        const s = document.createElement("small");
        s.textContent = r.msg;
        li.appendChild(s);
      }
      ul.appendChild(li);
    });
    lista.append(h, ul);
  });
})();
</script>
</body>
</html>
