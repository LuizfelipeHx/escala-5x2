<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Escala 5x2 - Testes automáticos</title>
  <style>
    body { font-family: "Segoe UI", system-ui, Arial, sans-serif; background: #f3f5f9; color: #17212f; margin: 0; padding: 24px; }
    main { max-width: 820px; margin: 0 auto; }
    h1 { margin: 0 0 6px; }
    #resumo { font-weight: 700; padding: 12px 16px; border-radius: 12px; }
    .ok-geral { background: #ddf3e8; color: #1e8e5a; }
    .falha-geral { background: #fde3e0; color: #c0392b; }
    ul { list-style: none; padding: 0; }
    li { background: #fff; border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; border-left: 5px solid #1e8e5a; }
    li.falha { border-color: #c0392b; }
    li small { display: block; color: #c0392b; margin-top: 4px; }
  </style>
</head>
<body>
<main>
  <h1>Testes automáticos da escala</h1>
  <p>Confere as regras do arquivo <code>js/core/escala.js</code> com os dados de <code>dados/equipe.js</code>. Abra de novo depois de editar os dados.</p>
  <p id="resumo"></p>
  <ul id="lista"></ul>
</main>

<script src="dados/equipe.js"></script>
<script src="js/core/datas.js"></script>
<script src="js/core/escala.js"></script>
<script src="js/core/sessao.js"></script>
<script>
(function () {
  "use strict";
  const { datas: D, escala: R, sessao: S, dados } = window.Escala;
  const resultados = [];

  function teste(nome, fn) {
    try {
      const r = fn();
      resultados.push({ nome, ok: r === true, msg: r === true ? "" : String(r) });
    } catch (e) {
      resultados.push({ nome, ok: false, msg: e.message });
    }
  }

  const ANO = 2026;
  const segundas = (n) => {
    const s0 = D.deIso(dados.config.inicioRodizio);
    return Array.from({ length: n }, (_, i) => D.addDias(s0, i * 7));
  };

  teste("O arquivo de dados é válido", () => {
    const erros = R.validarDados();
    return erros.length === 0 || erros.join(" | ");
  });

  teste(`Todos trabalham 5 e folgam 2 em todas as semanas de ${ANO} (sem contar ausências)`, () => {
    for (const p of dados.equipe) {
      for (const seg of segundas(52)) {
        let folgas = 0;
        for (let i = 0; i < 7; i++) if (R.situacaoNaEscala(p, D.addDias(seg, i)) === "folga") folgas++;
        if (folgas !== 2) return `${p.nome}, semana de ${D.iso(seg)}: ${folgas} folgas`;
      }
    }
    return true;
  });

  teste("Cada pessoa folga exatamente 1 domingo em qualquer sequência de semanas do rodízio", () => {
    const n = dados.config.gruposDomingo.length;
    const domingos = segundas(52).map((s) => D.addDias(s, 6));
    for (const p of dados.equipe) {
      for (let i = 0; i + n <= domingos.length; i++) {
        const c = domingos.slice(i, i + n).filter((d) => R.situacaoNaEscala(p, d) === "folga").length;
        if (c !== 1) return `${p.nome}: ${c} domingos de folga a partir de ${D.iso(domingos[i])}`;
      }
    }
    return true;
  });

  teste(`Sem ausências, a cobertura mínima é atendida em todos os dias de ${ANO}`, () => {
    for (let i = 0; i < 365; i++) {
      const d = D.addDias(new Date(ANO, 0, 1), i);
      for (const [funcao, minimo] of Object.entries(dados.config.coberturaMinima)) {
        const n = dados.equipe.filter((p) => p.funcao === funcao && R.situacaoNaEscala(p, d) === "trabalho").length;
        if (n < minimo) return `${D.iso(d)}: ${n} ${funcao}s (mínimo ${minimo})`;
      }
    }
    return true;
  });

  teste("Férias e atestado têm prioridade sobre a escala", () => {
    for (const a of dados.ausencias) {
      const p = R.porMatricula(a.matricula);
      if (R.situacao(p, D.deIso(a.inicio)) !== a.tipo) return `${p.nome} em ${a.inicio} não aparece como ${a.tipo}`;
      if (R.situacao(p, D.deIso(a.fim)) !== a.tipo) return `${p.nome} em ${a.fim} não aparece como ${a.tipo}`;
    }
    return true;
  });

  teste("O alerta de cobertura dispara quando falta gente (férias de motorista)", () => {
    const ferias = dados.ausencias.find((a) => a.tipo === "ferias" && R.porMatricula(a.matricula).funcao === "Motorista");
    if (!ferias) return true;
    let d = D.deIso(ferias.inicio);
    const fim = D.deIso(ferias.fim);
    while (d <= fim) {
      if (R.cobertura(d).some((c) => !c.ok)) return true;
      d = D.addDias(d, 1);
    }
    return "nenhum dia abaixo do mínimo durante as férias";
  });

  teste("A semana começa na segunda-feira", () =>
    D.iso(D.segundaDaSemana(D.deIso("2026-10-04"))) === "2026-09-28" || "início da semana errado");

  teste("Contagem de dias atravessa mês e ano", () =>
    D.diasEntre(D.deIso("2026-12-30"), D.deIso("2027-01-02")) === 3 || "contagem errada");

  teste("Login recusa senha errada e matrícula inexistente", () =>
    (!!S.entrar("10001", "senha-errada").erro && !!S.entrar("99999", dados.senhaDemo).erro) || "aceitou acesso inválido");

  teste("Login identifica colaborador e supervisor", () => {
    const a = S.entrar("10001", dados.senhaDemo).usuario;
    const b = S.entrar(dados.supervisores[0].matricula, dados.senhaDemo).usuario;
    S.sair();
    return (a.perfil === "colaborador" && b.perfil === "supervisor") || "perfis trocados";
  });

  const falhas = resultados.filter((r) => !r.ok).length;
  const resumo = document.getElementById("resumo");
  resumo.textContent = falhas
    ? `${falhas} de ${resultados.length} testes falharam.`
    : `Todos os ${resultados.length} testes passaram.`;
  resumo.className = falhas ? "falha-geral" : "ok-geral";

  const lista = document.getElementById("lista");
  resultados.forEach((r) => {
    const li = document.createElement("li");
    li.className = r.ok ? "" : "falha";
    li.textContent = (r.ok ? "OK  " : "FALHOU  ") + r.nome;
    if (!r.ok) {
      const s = document.createElement("small");
      s.textContent = r.msg;
      li.appendChild(s);
    }
    lista.appendChild(li);
  });
})();
</script>
</body>
</html>
